model:
  default: deepseek/deepseek-v4-pro
  provider: openrouter
toolsets: '["hermes-cli", "vision", "kanban"]'
agent:
  max_turns: 60
  verbose: false
  reasoning_effort: medium
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative
      solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and
      ~! Add sparkles and be super enthusiastic about everything! Every response should
      feel warm and adorable desu~! ヽ(>∀<☆)ノ
    catgirl: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and
      cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ.
      Be playful and curious like a cat, nya~!
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    noir: The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
terminal:
  backend: local
  cwd: .
  timeout: 180
  env_passthrough: '["KIE_AI_API_KEY", "CONTENT_PSQL_COMMAND", "CONTENT_DATABASE_URL",
    "CONTENT_DB_SCHEMA", "CONTENT_DB_TABLE", "POSTMYPOST_TOKEN", "POSTMYPOST_PROJECT_ID",
    "S3_ENDPOINT", "S3_REGION", "S3_BUCKET", "S3_ACCESS_KEY", "S3_SECRET_KEY", "S3_PUBLIC_BASE_URL",
    "FAL_KEY", "GOOGLE_SERVICE_ACCOUNT_FILE", "GOOGLE_CALENDAR_ID"]'
  home_mode: auto
web:
  backend: tavily
browser:
  inactivity_timeout: 120
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.3
  target_ratio: 0.1
  protect_last_n: 20
  protect_first_n: 2
prompt_caching:
  cache_ttl: 60m
auxiliary:
  free_only: false
  vision:
    provider: openrouter
    model: google/gemini-3.7-flash
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
  language: ru
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all
tts:
  provider: edge
  edge:
    voice: ru-RU-DmitryNeural
    speed: 1.0
stt:
  enabled: true
  provider: groq
  local:
    model: base
  openai:
    model: whisper-1
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 30000
  user_char_limit: 12000
  provider: supermemory
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  model: google/gemini-3.7-flash
  provider: openrouter
  max_iterations: 50
skills:
  creation_nudge_interval: 15
  # 19.4: ключ лежал ОДНОЙ СТРОКОЙ с JSON внутри. hermes читает такую строку как
  # ОДНО имя навыка (skills_config._normalize_skill_names), поэтому НИ ОДНО отключение
  # не действовало. Здесь настоящий YAML-список — проверять get_disabled_skills().
  disabled:
    - business-documents
    - docx
    - docx-editing
    - proposal-formatting
    - rus-ip-tax-calc
  # Имена ниже клиент выключил раньше, но из-за формы они не действовали.
  # Включать по его слову, отдельным шагом — не молча.
  #   БЫЛО ОТКЛЮЧЕНО КЛИЕНТОМ: airtable, architecture-diagram, arxiv, ascii-art,
  #     ascii-video, audiocraft-audio-generation, claude-code, claude-design,
  #     codebase-inspection, codex, comfyui, computer-use, design-md, dogfood,
  #     evaluating-llms-harness, excalidraw, gif-search, github-auth, github-code-review,
  #     github-issues, github-pr-workflow, github-repo-management, google-workspace,
  #     heartmula, himalaya, huggingface-hub, humanizer, jupyter-live-kernel, llama-cpp,
  #     llm-wiki, manim-video, maps, nano-pdf, node-inspect-debugger, notion, obsidian,
  #     ocr-and-documents, opencode, openhue, p5js, petdex, polymarket, pretext,
  #     python-debugpy, requesting-code-review, research-paper-writing,
  #     segment-anything-model, serving-llms-vllm, simplify-code, sketch, songsee,
  #     songwriting-and-ai-music, spike, systematic-debugging, teams-meeting-pipeline,
  #     test-driven-development, touchdesigner-mcp, weights-and-biases, xurl,
  #     youtube-content, yuanbao, execute_code
timezone: Europe/Moscow
approvals:
  destructive_slash_confirm: false
command_allowlist:
  - stop/restart system service
  - pip*
  - cat*
  - execute_code
  - git*
  - recursive delete
  - ls*
  - shell execution via heredoc
  - overwrite system config
  - python3*
  - echo*
  - script execution via -e/-c flag
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
onboarding:
  seen:
    profile_build_offered: true
    busy_input_prompt: true
updates:
  pre_update_backup: quick
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 32
session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
image_gen: {}
env: {}
platforms:
  telegram:
    extra:
      command_menu:
        max_commands: 100

# --- Этап 19.3: принуждение к делегированию профилю ---------------------
# Хук блокирует узкий сигнал «полез делать работу профиля сам», а не тулы:
# у delegate_task дети наследуют тулсеты родителя, отбирать руки нельзя.
# Карта зон — /root/.hermes/hooks/profile_guard.json (там же как добавить профиль).
hooks_auto_accept: true
hooks:
  pre_tool_call:
    - command: /usr/bin/python3 /root/.hermes/hooks/profile_guard.py
      matcher: "skill_view|terminal|execute_code|write_file|patch"
      timeout: 10
